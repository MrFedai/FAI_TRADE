# ============================================
# TRADING INTELLIGENCE SYSTEM — CONFIG
# ============================================
# Application configuration (non-secret values)
# Secret values go in .env, not here.

# ---- Workers ----
workers:
  news:
    poll_interval: 300       # 5 minutes
    max_articles_per_fetch: 50
    dedup_window_hours: 48   # Don't re-process articles older than 48h
  market:
    poll_interval: 60        # 1 minute
    assets:
      - BTC
      - ETH
      - SOL
      - XRP
  macro:
    poll_interval: 3600      # 1 hour

# ---- News Freshness ----
news_freshness:
  live_threshold_min: 5      # < 5 min = LIVE
  recent_threshold_min: 30   # < 30 min = RECENT
  stale_threshold_min: 120   # < 2h = STALE
  expired_threshold_min: 1440  # > 24h = EXPIRED

# ---- Importance Scoring ----
importance:
  keywords_high:
    - "FOMC"
    - "rate decision"
    - "CPI"
    - "NFP"
    - "GDP"
    - "hack"
    - "exploit"
    - "SEC"
    - "lawsuit"
    - "ban"
    - "ETF"
    - "approval"
    - "halving"
    - "upgrade"
    - "partnership"
  keywords_medium:
    - "earnings"
    - "quarterly"
    - "guidance"
    - "forecast"
    - "upgrade"
    - "downgrade"
    - "merger"
    - "acquisition"

# ---- Watchlist (initial) ----
watchlist:
  crypto:
    - BTC
    - ETH
    - SOL
    - XRP
  commodities:
    - GOLD
    - SILVER
    - OIL
  stocks:
    - NVDA
    - TSLA
    - AAPL
    - MSFT
    - COIN
    - MSTR

# ---- Macro Events ----
macro:
  track_events:
    - fomc
    - cpi
    - pce
    - nfp
    - gdp
    - unemployment
    - rate_decision
    - treasury_auction

# ---- AI ----
ai:
  local_model: "qwen2.5:7b"
  embed_model: "nomic-embed-text"
  temperature: 0.3           # Low temperature for financial analysis
  max_context_tokens: 4096
  budget_thresholds:
    warning: 0.80
    critical: 0.90
    exhausted: 1.00

# ---- Retention ----
retention:
  market_prices_1m_days: 30
  market_prices_1h_plus: permanent
  news_content_days: 90
  system_logs_days: 30
  api_usage_months: 12
  backups_days: 7
