# Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend metrics
  - job_name: "backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # Node exporter (if installed on host)
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Redis
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  # PostgreSQL (needs postgres_exporter)
  - job_name: "postgres"
    static_configs:
      - targets: ["host.docker.internal:9187"]
