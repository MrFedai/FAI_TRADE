version: "3.9"

# ============================================
# PERSONAL TRADING INTELLIGENCE SYSTEM
# Production Docker Compose — Ubuntu Server
# ============================================
#
# All ports bind to TAILSCALE_IP — services are only
# accessible through the Tailscale VPN mesh.
# Replace ${TAILSCALE_IP} with the actual Tailscale IP
# in the .env file.

services:
  # ---- Database ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_intel}
      POSTGRES_USER: ${POSTGRES_USER:-tis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tis_net

  # ---- Cache ----
  redis:
    image: redis:7-alpine
    container_name: tis_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tis_net

  # ---- Backend API ----
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: tis_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_intel}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - APP_ENV=production
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-INFO}
      - MONTHLY_AI_BUDGET=${MONTHLY_AI_BUDGET:-50.0}
    volumes:
      - ../logs:/app/logs
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tis_net

  # ---- Telegram Bot ----
  telegram_bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.telegram
    container_name: tis_telegram
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS}
      - BACKEND_URL=http://backend:8000
    volumes:
      - ../logs:/app/logs
    networks:
      - tis_net

  # ---- News Worker ----
  news_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: tis_news_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORKER_TYPE=news
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_intel}
      - REDIS_URL=redis://redis:6379/0
      - FRED_API_KEY=${FRED_API_KEY:-}
      - BEA_API_KEY=${BEA_API_KEY:-}
    volumes:
      - ../logs:/app/logs
    networks:
      - tis_net

  # ---- Market Data Worker ----
  market_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: tis_market_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORKER_TYPE=market
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_intel}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../logs:/app/logs
    networks:
      - tis_net

  # ---- Macro Worker ----
  macro_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: tis_macro_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - WORKER_TYPE=macro
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-tis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-trading_intel}
      - REDIS_URL=redis://redis:6379/0
      - FRED_API_KEY=${FRED_API_KEY:-}
      - BEA_API_KEY=${BEA_API_KEY:-}
      - BLS_API_KEY=${BLS_API_KEY:-}
    volumes:
      - ../logs:/app/logs
    networks:
      - tis_net

  # ---- Scheduler ----
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scheduler
    container_name: tis_scheduler
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - tis_net

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:latest
    container_name: tis_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:9090:9090"
    networks:
      - tis_net

  grafana:
    image: grafana/grafana:latest
    container_name: tis_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    networks:
      - tis_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  tis_net:
    driver: bridge
