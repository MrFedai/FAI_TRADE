[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-intelligence"
version = "0.1.0"
description = "Personal Trading Intelligence System — AI-powered market intelligence for decision support"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
authors = [{name = "X"}]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # Cache
    "redis[hiredis]>=5.2.0",
    # HTTP
    "httpx>=0.28.0",
    # RSS / HTML
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # Telegram
    "python-telegram-bot>=22.0",
    # Data
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "pandas-ta>=0.3.14b0",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Scheduling
    "apscheduler>=3.11.0",
    # Logging
    "structlog>=24.4.0",
    # Config
    "pyyaml>=6.0.2",
    # Utilities
    "python-dateutil>=2.9.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
ai = [
    "ollama>=0.4.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
]
backtest = [
    "vectorbt>=0.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "telegram_bot*", "workers*", "ai*", "indicators*", "backtesting*", "database*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
